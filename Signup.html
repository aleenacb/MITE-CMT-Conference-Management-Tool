<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sign Up</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Signup.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="wrap">

  <!-- LEFT — Aurora illustration panel -->
  <div class="art">
    <svg class="art-svg" viewBox="0 0 400 660" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx="40%" cy="40%" r="80%">
          <stop offset="0%"  stop-color="#0d1b2a"/>
          <stop offset="60%" stop-color="#1b1041"/>
          <stop offset="100%" stop-color="#0a0a1a"/>
        </radialGradient>
        <radialGradient id="ag1" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#34d399" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ag2" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#818cf8" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ag3" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#f43f5e" stop-opacity=".4"/>
          <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ag4" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#fbbf24" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- Background -->
      <rect width="400" height="660" fill="url(#bg)"/>
      <!-- Aurora glows -->
      <ellipse cx="80"  cy="200" rx="160" ry="140" fill="url(#ag1)"/>
      <ellipse cx="320" cy="120" rx="140" ry="120" fill="url(#ag2)"/>
      <ellipse cx="200" cy="360" rx="180" ry="140" fill="url(#ag3)"/>
      <ellipse cx="350" cy="500" rx="130" ry="110" fill="url(#ag4)"/>
      <!-- Aurora wave lines -->
      <path d="M0 180 Q80 120 160 180 Q240 240 320 160 Q360 120 400 150" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.3"/>
      <path d="M0 210 Q100 150 200 210 Q300 270 400 190" stroke="#818cf8" stroke-width="1" fill="none" opacity="0.25"/>
      <path d="M0 240 Q80 190 180 240 Q280 290 400 220" stroke="#f43f5e" stroke-width="1" fill="none" opacity="0.2"/>
      <!-- Stars -->
      <circle cx="30"  cy="50"  r="1.5" fill="#fff"     opacity=".8"/>
      <circle cx="70"  cy="30"  r="1"   fill="#fff"     opacity=".6"/>
      <circle cx="120" cy="65"  r="1.5" fill="#c4b5fd"  opacity=".9"/>
      <circle cx="180" cy="25"  r="1"   fill="#fff"     opacity=".7"/>
      <circle cx="230" cy="50"  r="1.5" fill="#fde68a"  opacity=".8"/>
      <circle cx="290" cy="35"  r="1"   fill="#fff"     opacity=".6"/>
      <circle cx="350" cy="60"  r="1.5" fill="#c4b5fd"  opacity=".7"/>
      <circle cx="380" cy="20"  r="1"   fill="#fff"     opacity=".8"/>
      <circle cx="50"  cy="100" r="1"   fill="#fde68a"  opacity=".7"/>
      <circle cx="150" cy="90"  r="1.5" fill="#fff"     opacity=".5"/>
      <circle cx="260" cy="80"  r="1"   fill="#c4b5fd"  opacity=".6"/>
      <circle cx="370" cy="95"  r="1.5" fill="#fff"     opacity=".7"/>
      <!-- Floating phone mockups -->
      <rect x="30"  y="470" width="60" height="90" rx="8" fill="#1a1040" opacity=".8"/>
      <rect x="38"  y="478" width="44" height="74" rx="5" fill="#2d1b6e" opacity=".9"/>
      <rect x="48"  y="490" width="24" height="3"  rx="1" fill="#818cf8" opacity=".6"/>
      <rect x="48"  y="497" width="16" height="3"  rx="1" fill="#818cf8" opacity=".4"/>
      <ellipse cx="60" cy="535" rx="6" ry="4" fill="#34d399" opacity=".5"/>

      <rect x="150" y="455" width="50"  height="105" rx="8" fill="#1a1040" opacity=".8"/>
      <rect x="157" y="462" width="36"  height="90"  rx="5" fill="#2d1b6e" opacity=".9"/>
      <rect x="164" y="474" width="22"  height="3"   rx="1" fill="#f43f5e" opacity=".6"/>
      <rect x="164" y="481" width="14"  height="3"   rx="1" fill="#f43f5e" opacity=".4"/>
      <ellipse cx="175" cy="530" rx="5" ry="3.5" fill="#fbbf24" opacity=".5"/>

      <rect x="270" y="465" width="55"  height="95" rx="8" fill="#1a1040" opacity=".8"/>
      <rect x="277" y="472" width="41"  height="80" rx="5" fill="#2d1b6e" opacity=".9"/>
      <rect x="284" y="484" width="26"  height="3"  rx="1" fill="#fbbf24" opacity=".6"/>
      <rect x="284" y="491" width="18"  height="3"  rx="1" fill="#fbbf24" opacity=".4"/>
      <ellipse cx="297" cy="530" rx="6" ry="4" fill="#818cf8" opacity=".5"/>
      <!-- Ground -->
      <path d="M0 580 Q100 555 200 570 Q300 585 400 560 L400 660 L0 660Z" fill="#0d0b1e"/>
      <path d="M0 600 Q80 582 160 595 Q240 608 320 590 Q360 582 400 587 L400 660 L0 660Z" fill="#110e2a"/>
      <circle cx="90"  cy="590" r="2"   fill="#34d399" opacity=".7"/>
      <circle cx="200" cy="582" r="2.5" fill="#818cf8" opacity=".8"/>
      <circle cx="310" cy="594" r="2"   fill="#f43f5e" opacity=".7"/>
    </svg>

    <div class="art-content">
      <div class="art-icon"><i class="ti ti-rocket"></i></div>
      <div class="art-h">Start your journey<br>with us today</div>
      <div class="art-p">Join millions of people who trust<br>our platform every single day.</div>
      <!-- <ul class="feature-list">
        <li><i class="ti ti-check"></i> Free forever — no credit card needed</li>
        <li><i class="ti ti-check"></i> Secure &amp; encrypted by default</li>
        <li><i class="ti ti-check"></i> Access from any device, anytime</li>
        <li><i class="ti ti-check"></i> 24/7 support when you need it</li>
      </ul> -->
    </div>
  </div>

  <!-- RIGHT — Signup form -->
  <div class="form-side">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">Luminary</span>
    </div>
    <p class="form-title">Create your account</p>
    <p class="form-sub">Already have one? <a href="Login.html">Sign in</a></p>

    <form id="signupForm" novalidate>
      <div class="name-row">
        <div class="field">
          <label for="fname">First name</label>
          <div class="inp-wrap">
            <i class="ti ti-user"></i>
            <input class="inp" type="text" id="fname" placeholder="Aleena" autocomplete="given-name" required>
          </div>
        </div>
        <div class="field">
          <label for="lname">Last name</label>
          <div class="inp-wrap">
            <i class="ti ti-user"></i>
            <input class="inp" type="text" id="lname" placeholder="CB" autocomplete="family-name" required>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="semail">Email address</label>
        <div class="inp-wrap">
          <i class="ti ti-mail"></i>
          <input class="inp" type="email" id="semail" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="spw">Password</label>
        <div class="inp-wrap">
          <i class="ti ti-lock"></i>
          <input class="inp" type="password" id="spw" placeholder="Create a strong password" autocomplete="new-password" required>
          <i class="ti ti-eye eye" id="eyeIco"></i>
        </div>
        <div class="strength-wrap" id="swrap">
          <div class="strength-track"><div class="strength-bar" id="sbar"></div></div>
          <div class="strength-label" id="slabel">Weak</div>
        </div>
      </div>

      <div class="field">
        <label for="cpw">Confirm password</label>
        <div class="inp-wrap">
          <i class="ti ti-lock-check"></i>
          <input class="inp" type="password" id="cpw" placeholder="Repeat your password" autocomplete="new-password" required>
        </div>
      </div>

      <div class="check-row">
        <input type="checkbox" id="terms">
        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
      </div>

      <button class="btn-signup" type="submit">
        <i class="ti ti-user-plus"></i> Create account
      </button>
    </form>

    <div class="divider"><div class="dl"></div><span class="dt">or sign up with</span><div class="dl"></div></div>

    <div class="soc-row">
      <button class="soc-btn" type="button"><i class="ti ti-brand-google" style="color:#EA4335"></i> Google</button>
      <button class="soc-btn" type="button"><i class="ti ti-brand-github"></i> GitHub</button>
      <button class="soc-btn" type="button"><i class="ti ti-brand-twitter" style="color:#1d9bf0"></i> Twitter</button>
    </div>

    <p class="foot">Already have an account? <a href="Login.html">Sign in</a></p>
  </div>
</div>

<script src="navigation.js" defer></script>
<script>
  const spw = document.getElementById('spw');
  const eyeIco = document.getElementById('eyeIco');
  const swrap = document.getElementById('swrap');
  const sbar  = document.getElementById('sbar');
  const slabel = document.getElementById('slabel');

  eyeIco.addEventListener('click', () => {
    const show = spw.type === 'password';
    spw.type = show ? 'text' : 'password';
    eyeIco.className = show ? 'ti ti-eye-off eye' : 'ti ti-eye eye';
  });

  spw.addEventListener('input', () => {
    const v = spw.value;
    swrap.style.display = v ? 'block' : 'none';
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/\d/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const widths  = [0, 20, 45, 75, 100];
    const colors  = ['', '#f43f5e', '#fbbf24', '#8b5cf6', '#34d399'];
    const labels  = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    sbar.style.width      = widths[score] + '%';
    sbar.style.background = colors[score];
    slabel.textContent    = labels[score];
    slabel.style.color    = colors[score];
  });

  document.getElementById('signupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fn = document.getElementById('fname');
    const ln = document.getElementById('lname');
    const em = document.getElementById('semail');
    const pw1 = spw;
    const pw2 = document.getElementById('cpw');
    const tc  = document.getElementById('terms');
    let ok = true;

    [fn, ln, em, pw1, pw2].forEach(el => {
      el.classList.remove('err');
      if (!el.value.trim()) { el.classList.add('err'); ok = false; }
    });

    if (pw1.value && pw2.value && pw1.value !== pw2.value) {
      pw2.classList.add('err'); ok = false;
    }

    if (!tc.checked) ok = false;
    if (ok) window.location.href = 'Homepage.html';
  });
</script>
</body>
</html>
