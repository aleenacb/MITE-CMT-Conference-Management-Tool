<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – MITECMT Conference</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:    #1abc9c;
      --teal2:   #149279;
      --coral:   #ff6b6b;
      --gold:    #f7c948;
      --purple:  #a78bfa;
      --blue:    #3b82f6;
      --bg:      #f0fdf9;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Animated background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 10% 20%, rgba(26,188,156,.18) 0%, transparent 55%),
        radial-gradient(ellipse at 90% 80%, rgba(167,139,250,.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 10%, rgba(255,107,107,.12) 0%, transparent 45%),
        radial-gradient(ellipse at 20% 90%, rgba(59,130,246,.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* floating shapes */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: .25;
      animation: drift 12s ease-in-out infinite;
    }
    .s1 { width:260px;height:260px; background:var(--teal);  top:-80px; left:-80px; animation-delay:0s; }
    .s2 { width:200px;height:200px; background:var(--coral); bottom:-60px;right:-60px; animation-delay:-4s; }
    .s3 { width:140px;height:140px; background:var(--gold);  top:50%;left:70%; animation-delay:-8s; }
    @keyframes drift {
      0%,100%{transform:translateY(0) scale(1);}
      50%    {transform:translateY(-30px) scale(1.07);}
    }

    /* ── Main card ── */
    .form-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 900px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.13);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      animation: popIn .65s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn {
      from{opacity:0;transform:scale(.92) translateY(24px);}
      to  {opacity:1;transform:scale(1)   translateY(0);}
    }

    /* ══════════════════════
       LEFT — Info panel
    ══════════════════════ */
    .info-panel {
      background: linear-gradient(160deg, #0d9488 0%, #1abc9c 45%, #34d399 100%);
      padding: 2.6rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      position: relative;
      overflow: hidden;
    }

    /* decorative circles */
    .info-panel::before {
      content:'';
      position:absolute; width:220px;height:220px;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      top:-60px; right:-60px;
    }
    .info-panel::after {
      content:'';
      position:absolute; width:160px;height:160px;
      border-radius:50%;
      background:rgba(255,255,255,.06);
      bottom:-50px; left:-40px;
    }

    .info-panel h2 {
      font-family:'Playfair Display',serif;
      font-size:1.75rem;
      color:#fff;
      line-height:1.15;
      z-index:1;
    }
    .info-panel h2 span { color: var(--gold); }

    .info-panel .tagline {
      font-size:.82rem;
      font-weight:600;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:rgba(255,255,255,.7);
      z-index:1;
    }

    .info-panel p {
      font-size:.85rem;
      color:rgba(255,255,255,.88);
      line-height:1.7;
      z-index:1;
    }

    /* ── Single conference image ── */
    .img-single {
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16/9;
      position: relative;
      z-index: 1;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
    }
    .img-single img {
      width:100%; height:100%;
      object-fit:cover;
      transition: transform .5s;
    }
    .img-single:hover img { transform: scale(1.05); }
    .img-single .overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,.5), transparent 55%);
      display:flex; align-items:flex-end;
      padding:14px 16px;
    }
    .img-single .overlay span {
      font-size:.78rem;
      font-weight:700;
      color:#fff;
      text-transform:uppercase;
      letter-spacing:.09em;
    }

    /* ══════════════════════
       RIGHT — Form panel
    ══════════════════════ */
    .form-panel {
      padding: 2.6rem 2.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }

    /* subtle top rainbow bar */
    .form-panel::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:4px;
      background: linear-gradient(90deg, var(--teal), var(--purple), var(--coral), var(--gold));
    }

    .form-panel h3 {
      font-family:'Playfair Display',serif;
      font-size:1.55rem;
      color:#1a1a2e;
      margin-bottom:.3rem;
    }
    .form-panel .sub {
      font-size:.8rem;
      color:#888;
      margin-bottom:.4rem;
    }

    /* fields */
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label {
      font-size:.72rem;
      font-weight:700;
      letter-spacing:.07em;
      text-transform:uppercase;
      color:#555;
    }
    .field input,
    .field textarea {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 11px 16px;
      font-family:'Poppins',sans-serif;
      font-size:.88rem;
      color:#222;
      outline:none;
      transition: border-color .25s, box-shadow .25s;
      background:#fafafa;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(26,188,156,.12);
      background:#fff;
    }
    .field textarea { resize:vertical; min-height:100px; line-height:1.6; }

    /* row of 2 */
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* submit */
    .btn {
      padding:13px;
      background:linear-gradient(135deg, var(--teal), var(--blue));
      border:none;
      border-radius:14px;
      font-family:'Poppins',sans-serif;
      font-size:.95rem;
      font-weight:700;
      color:#fff;
      cursor:pointer;
      transition:transform .15s, box-shadow .2s, background-position .3s;
      box-shadow:0 6px 20px rgba(26,188,156,.35);
      background-size:200%;
      background-position:left;
      letter-spacing:.03em;
    }
    .btn:hover {
      transform:translateY(-2px);
      box-shadow:0 10px 28px rgba(26,188,156,.42);
      background-position:right;
    }
    .btn:active { transform:translateY(0); }

    /* divider */
    .divider { height:1px; background:linear-gradient(90deg,transparent,#e5e7eb,transparent); margin:.2rem 0; }

    @media(max-width:700px){
      .form-card { grid-template-columns:1fr; }
      .img-grid  { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>

  <div class="form-card">

    <!-- ── LEFT INFO PANEL ── -->
    <div class="info-panel">
      <div class="tagline">MITECMT · Conference Tool</div>

      <h2>Let's Get<br>in <span>Touch</span> ✦</h2>

      <p>Welcome to the <strong>MITE Conference Management Tool</strong> — a platform designed to streamline academic conferences at the university level.</p>

      <!-- Single conference image -->
      <div class="img-single">
        <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&q=85" alt="Conference hall">
        <div class="overlay"><span>🎓 MITE Annual Conference</span></div>
      </div>
    </div>

    <!-- ── RIGHT FORM PANEL ── -->
    <div class="form-panel">
      <div>
        <h3>Contact Us</h3>
        <p class="sub">Fill in the form and our team will get back to you shortly.</p>
      </div>

      <form action="index.html" autocomplete="off">
        <div class="row2" style="margin-bottom:12px;">
          <div class="field">
            <label for="name">Username</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="john@mite.ac.in" required>
          </div>
        </div>

        <div class="field" style="margin-bottom:12px;">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message or enquiry here…"></textarea>
        </div>

        <div class="divider"></div>

        <button type="submit" class="btn" style="width:100%;margin-top:10px;">
          Send Message 
        </button>
      </form>
    </div>

  </div>
</body>
</html>
